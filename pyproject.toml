[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mazegen"
version = "1.0.0"
description = "Reusable maze generation"
requires-python = ">=3.10"

# ignore_missing_imports "mlx"
[tool.mypy]
strict = true

[[tool.mypy.overrides]]
module = "mlx.*"
ignore_missing_imports = true